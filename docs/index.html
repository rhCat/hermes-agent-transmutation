<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hermes-agent // mechanical transmutation</title>
<style>
  :root {
    --bg: #0b0e14; --bg-panel: #10141d; --bg-col: #0e1219;
    --bg-row-hover: #1a2130; --bg-row-sel: #1d2a3f;
    --border: #1f2735; --text: #cdd6e4; --text-dim: #7a8699;
    --accent: #35d0ba; --accent2: #c274e8; --num: #e5b567;
    --str: #9ece6a; --key: #8fb8e8;
    --err: #f7768e; --warn: #e0af68; --info: #7aa2f7; --ok: #9ece6a;
    font-size: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel); flex: none;
  }
  header .logo { color: var(--accent); font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  header .logo span { color: var(--accent2); }
  header .src { color: var(--text-dim); font-size: 12px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header a { color: var(--text-dim); text-decoration: none; font-size: 12px; white-space: nowrap; }
  header a:hover { color: var(--accent); }
  header a.tab { padding: 2px 9px; border: 1px solid var(--border); border-radius: 4px; }
  header a.tab.on { color: var(--accent); border-color: var(--accent); }

  #twins { flex: 1; overflow-y: auto; display: none; padding: 0 0 24px; }
  .tw { border-bottom: 1px solid var(--border); padding: 9px 14px; }
  .tw .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tw .cnt { color: var(--accent); font-weight: 700; }
  .tw .loc { color: var(--num); font-variant-numeric: tabular-nums; }
  .tw .sig { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
  .tw .mem { margin-top: 6px; display: grid;
             grid-template-columns: minmax(0,1fr) auto auto auto; gap: 2px 12px; font-size: 11.5px; }
  .tw .mem .fn { color: var(--str); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tw .mem .fn small { color: var(--text-dim); }
  .tw .mem .num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .tw .mem a { color: var(--info); text-decoration: none; }
  .tw .mem a:hover { color: var(--accent); text-decoration: underline; }
  .banner { padding: 8px 14px; color: var(--warn); font-size: 11.5px;
            border-bottom: 1px solid var(--border); background: var(--bg-col); }

  .stats { display: flex; border-bottom: 1px solid var(--border);
           background: var(--bg-panel); flex: none; overflow-x: auto; }
  .stat { padding: 8px 16px; border-right: 1px solid var(--border); min-width: 108px; }
  .stat .k { color: var(--text-dim); font-size: 11px; }
  .stat .v { color: var(--num); font-size: 19px; font-weight: 700; margin-top: 1px; }
  .stat .v.ok { color: var(--ok); } .stat .v.warn { color: var(--warn); }

  #crumbs {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 14px;
    border-bottom: 1px solid var(--border); background: var(--bg-col);
    font-size: 12px; color: var(--text-dim); overflow-x: auto; white-space: nowrap;
  }
  #crumbs .c { color: var(--accent); cursor: pointer; }
  #crumbs .c:hover { text-decoration: underline; }
  #crumbs .sep { color: var(--text-dim); }

  #columns { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; min-width: 0; }
  .col {
    flex: none; width: 300px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--bg-col); min-height: 0;
  }
  .col:last-child { flex: 1; min-width: 340px; }
  .col-head {
    flex: none; padding: 6px 10px 4px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim); display: flex; align-items: baseline; gap: 6px;
    overflow: hidden; white-space: nowrap;
  }
  .col-head .name { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  .col-filter { margin: 6px 8px; }
  .col-filter input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font: inherit; font-size: 12px; padding: 3px 8px; outline: none;
  }
  .col-filter input:focus { border-color: var(--accent); }
  .col-body { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 20px; }

  .row {
    display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer;
    font-size: 12.5px; white-space: nowrap; overflow: hidden;
    border-left: 2px solid transparent;
  }
  .row:hover { background: var(--bg-row-hover); }
  .row.sel { background: var(--bg-row-sel); border-left-color: var(--accent); }
  .row .k { color: var(--key); overflow: hidden; text-overflow: ellipsis; }
  .row.sel .k { color: var(--accent); }
  .row .n { color: var(--num); flex: none; font-variant-numeric: tabular-nums; }
  .row .arrow { margin-left: auto; color: var(--text-dim); flex: none; }
  .col-empty { padding: 12px 10px; color: var(--text-dim); font-size: 12px; }
  .more-btn {
    margin: 6px 8px; width: calc(100% - 16px); background: #16202e; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font: inherit; font-size: 12px;
    padding: 3px 8px; cursor: pointer;
  }

  .calls { border-bottom: 1px solid var(--border); background: var(--bg); }
  .calls .hd { padding: 5px 10px; font-size: 11px; color: var(--text-dim);
               display: flex; gap: 8px; align-items: baseline; }
  .calls .hd b { color: var(--accent); font-weight: 600; }
  .calls .warn { color: var(--warn); }
  .calls .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1px; background: var(--border); }
  .calls .side { background: var(--bg); padding: 4px 0 6px; min-height: 40px; }
  .calls .side h4 { margin: 0; padding: 2px 10px 4px; font-size: 10px; font-weight: 600;
                    color: var(--text-dim); text-transform: lowercase; }
  .calls .ln { padding: 2px 10px; font-size: 11.5px; cursor: pointer;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .calls .ln:hover { background: var(--bg-row-hover); color: var(--accent); }
  .calls .ln small { color: var(--text-dim); }
  .calls .none { padding: 2px 10px; font-size: 11.5px; color: var(--text-dim); }
  .claim { padding: 7px 10px; border-bottom: 1px solid rgba(31,39,53,.5); font-size: 12px; }
  .claim .top { display: flex; gap: 7px; align-items: baseline; }
  .claim .fn { color: var(--str); overflow: hidden; text-overflow: ellipsis; }
  .claim .meta { color: var(--text-dim); font-size: 11px; margin-top: 3px; }
  .claim .meta b { color: var(--text); font-weight: 400; }
  .claim a.srclink { color: var(--info); text-decoration: none; margin-left: auto; flex: none; font-size: 11px; }
  .claim a.srclink:hover { color: var(--accent); text-decoration: underline; }
  .tag { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700;
         white-space: nowrap; flex: none; }
  .q { color: var(--text-dim); font-size: 10px; flex: none; }

  #atlas { flex: 1; display: none; position: relative; min-height: 0; overflow: hidden; }
  /* width/height are NOT optional: canvas is a replaced element, so `inset:0`
     alone leaves it at its intrinsic 300×150 and the map draws into a stamp. */
  #atlas canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #atlas canvas.drag { cursor: grabbing; }
  #atlas .bar {
    position: absolute; top: 8px; left: 10px; z-index: 3; display: flex;
    gap: 5px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 20px);
  }
  #atlas .bar .grp { display: flex; gap: 4px; align-items: center;
                     background: rgba(16,20,29,.9); border: 1px solid var(--border);
                     border-radius: 5px; padding: 3px 6px; }
  #atlas .bar label { color: var(--text-dim); font-size: 10.5px; }
  #atlas button {
    background: transparent; color: var(--text-dim); border: 1px solid transparent;
    border-radius: 3px; font: inherit; font-size: 11px; padding: 1px 7px; cursor: pointer;
  }
  #atlas button:hover { color: var(--accent); }
  #atlas button.on { color: var(--accent); border-color: var(--accent); }
  #atlas input[type=range] { width: 90px; accent-color: var(--accent); }
  #atlas .note {
    position: absolute; left: 10px; bottom: 8px; z-index: 3; max-width: 46%;
    background: rgba(16,20,29,.9); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 8px; font-size: 10.5px; color: var(--text-dim); line-height: 1.5;
  }
  #atlas .note b { color: var(--text); font-weight: 600; }
  #atlas .legend {
    position: absolute; right: 10px; top: 8px; z-index: 3;
    background: rgba(16,20,29,.9); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 8px; font-size: 10.5px; color: var(--text-dim);
  }
  #atlas .legend div { display: flex; align-items: center; gap: 5px; padding: 1px 0; cursor: pointer; }
  #atlas .legend div:hover { color: var(--text); }
  #atlas .legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  #atlas .legend div.off { opacity: .35; }
  #atlas .tip {
    position: absolute; z-index: 4; pointer-events: none; display: none;
    background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 5px;
    padding: 5px 8px; font-size: 11px; max-width: 340px; line-height: 1.55;
  }
  #atlas .tip .t { color: var(--accent); word-break: break-all; }
  #atlas .tip .d { color: var(--text-dim); }
  #atlas .tip .d b { color: var(--text); font-weight: 400; }

  footer {
    flex: none; padding: 6px 14px; border-top: 1px solid var(--border);
    background: var(--bg-panel); color: var(--text-dim); font-size: 11px;
    white-space: nowrap; overflow-x: auto;
  }
  footer b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo">alembic<span>//</span>transmutation</div>
  <div class="src" id="src">loading…</div>
  <div class="spacer"></div>
  <a href="#" id="tabBrowse" class="tab on">browse</a>
  <a href="#" id="tabAtlas" class="tab">atlas</a>
  <a href="#" id="tabTwins" class="tab">similar functions</a>
  <a href="https://github.com/rhCat/hermes-agent-transmutation" target="_blank" rel="noopener">method ↗</a>
  <a href="https://github.com/NousResearch/hermes-agent" target="_blank" rel="noopener">source ↗</a>
</header>

<div class="stats" id="stats"></div>
<div id="crumbs"></div>
<div id="columns"></div>
<div id="atlas">
  <canvas id="cnv"></canvas>
  <div class="bar">
    <div class="grp" id="atScope"></div>
    <div class="grp" id="atLayout"></div>
    <div class="grp"><label>min calls</label><input type="range" id="atMinW" min="1" max="20" value="1">
      <span id="atMinWv" style="color:var(--num);width:16px">1</span></div>
    <div class="grp"><button id="atFit">fit</button></div>
  </div>
  <div class="legend" id="atLegend"></div>
  <div class="note" id="atNote">loading graph…</div>
  <div class="tip" id="atTip"></div>
</div>
<div id="twins"></div>
<footer id="foot"></footer>

<script>
const PAGE = 200;
const SHAPE_COLOR = {
  ACQUIRE: ["#1a2f26", "#9ece6a"], RELEASE: ["#1a2f26", "#9ece6a"],
  TRANSFER: ["#1a2f26", "#9ece6a"], RAISE: ["#33222a", "#f7768e"],
  GATE: ["#2a2333", "#c274e8"], ABSORB: ["#2a2333", "#c274e8"],
  ALTER_STATE: ["#332b1c", "#e0af68"], RETURN: ["#1c2733", "#7aa2f7"],
  NO_EFFECT: ["#1e232b", "#7a8699"],
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tag = s => {
  const [bg, fg] = SHAPE_COLOR[s] || ["#1e232b", "#7a8699"];
  return `<span class="tag" style="background:${bg};color:${fg}">${esc(s)}</span>`;
};
const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

let META = {}, TREE = {}, CLAIMS = [], CG = null, cgPending = null;
// path = [module, file, function] — the drill-down, one segment per column
const state = { path: [], colUI: {} };

// Every claim carries file+line, so each is one click from the exact source line
// at the analysed commit. A review panel that cannot reach the code is a list.
function srcUrl(file, line) {
  const base = `https://github.com/${META.repo}/blob/${META.commit}/${file}`;
  return line ? `${base}#L${line}` : base;
}

fetch("data/summary.json").then(r => r.json()).then(d => {
  META = d.meta || {};
  CLAIMS = d.claims || [];
  for (const c of CLAIMS) {
    const m = (TREE[c.module] ||= {});
    const f = (m[c.file] ||= {});
    (f[c.fn] ||= []).push(c);
  }
  renderChrome();
  render();
}).catch(e => {
  document.getElementById("columns").innerHTML =
    `<div class="col-empty">could not load <b>data/summary.json</b><br>${esc(e)}</div>`;
});

function renderChrome() {
  const m = META;
  document.getElementById("src").textContent =
    `${m.repo || "?"} @ ${(m.commit || "").slice(0, 12)}`;
  const deg = (m.degradations || []).length;
  const stats = [
    ["functions", m.functions, ""], ["claims", m.claims, ""],
    ["files", m.files, ""], ["modules", (m.modules || []).length, ""],
    ["acquire", m.acquire ?? 0, m.acquire ? "ok" : "warn"],
    ["release", m.release ?? 0, m.release ? "ok" : "warn"],
    ["llm calls", m.llm_calls ?? 0, "ok"],
    ["degradations", deg, deg ? "warn" : "ok"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([k, v, c]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v ?? "—"}</div></div>`).join("");
  document.getElementById("foot").innerHTML =
    `mechanical only — <b>llm_calls ${m.llm_calls ?? 0}</b>, <b>docs_read ${m.docs_read}</b>. ` +
    `channels <b>${(m.channels || []).join(" · ")}</b>. ` +
    (deg ? `<span style="color:var(--warn)">degradations: ${esc((m.degradations || []).join("; "))}</span>`
         : `no degradations — every channel present and contributing.`) +
    ` scope: <b>${esc(m.analysed || "")}</b>.`;
}

const LEVELS = ["module", "file", "function"];

function nodeAt(path) {
  let n = TREE;
  for (const seg of path) {
    if (n == null) return null;
    n = Array.isArray(n) ? null : n[seg];
  }
  return n;
}
const isBranch = n => n && !Array.isArray(n);

function countLeaves(n) {
  if (Array.isArray(n)) return n.length;
  let t = 0;
  for (const k in n) t += countLeaves(n[k]);
  return t;
}

function uiFor(key) { return (state.colUI[key] ||= { filter: "", show: PAGE }); }

function render() {
  renderCrumbs();
  const wrap = document.getElementById("columns");
  wrap.textContent = "";
  const depths = state.path.length + (isBranch(nodeAt(state.path)) ? 1 : 0);
  for (let d = 0; d < depths; d++) {
    const parent = nodeAt(state.path.slice(0, d));
    if (!isBranch(parent)) break;
    wrap.appendChild(buildColumn(d, parent));
  }
  const leaf = nodeAt(state.path);
  if (Array.isArray(leaf)) wrap.appendChild(buildClaims(leaf));
  wrap.scrollLeft = wrap.scrollWidth;
}

function renderCrumbs() {
  const c = document.getElementById("crumbs");
  c.textContent = "";
  const root = el("span", "c", "all");
  root.onclick = () => { state.path = []; render(); };
  c.appendChild(root);
  state.path.forEach((seg, i) => {
    c.appendChild(el("span", "sep", "›"));
    const s = el("span", "c", String(seg).split("/").pop());
    s.title = String(seg);
    s.onclick = () => { state.path = state.path.slice(0, i + 1); render(); };
    c.appendChild(s);
  });
  const leaf = nodeAt(state.path);
  if (Array.isArray(leaf) && leaf[0]) {
    const a = el("a", null, "open source ↗");
    a.href = srcUrl(leaf[0].file, leaf[0].line);
    a.target = "_blank"; a.rel = "noopener";
    a.style.cssText = "margin-left:auto;color:var(--info);text-decoration:none;font-size:12px";
    c.appendChild(a);
  }
}

function buildColumn(depth, parent) {
  const col = el("div", "col");
  const key = state.path.slice(0, depth).join("␀");
  const ui = uiFor(key);

  const head = el("div", "col-head");
  head.appendChild(el("span", "name", LEVELS[depth] || "node"));
  const kids = Object.keys(parent).sort();
  head.appendChild(el("span", null, `${kids.length}`));
  col.appendChild(head);

  let shown = kids;
  const label = k => depth === 1 ? k.split("/").slice(-2).join("/") : k;

  if (kids.length > 25) {
    const fw = el("div", "col-filter");
    const inp = document.createElement("input");
    inp.type = "search";
    inp.placeholder = `filter ${kids.length}`;
    inp.value = ui.filter;
    inp.addEventListener("input", () => {
      ui.filter = inp.value.toLowerCase(); ui.show = PAGE; fill();
    });
    fw.appendChild(inp);
    col.appendChild(fw);
  }

  const body = el("div", "col-body");
  col.appendChild(body);
  const selSeg = state.path[depth];

  function fill() {
    body.textContent = "";
    shown = ui.filter ? kids.filter(k => k.toLowerCase().includes(ui.filter)) : kids;
    if (!shown.length) { body.appendChild(el("div", "col-empty", "no matches")); return; }
    const selIdx = shown.indexOf(selSeg);
    if (selIdx >= ui.show) ui.show = Math.ceil((selIdx + 1) / PAGE) * PAGE;
    for (const k of shown.slice(0, ui.show)) {
      const r = el("div", "row" + (k === selSeg ? " sel" : ""));
      r.appendChild(el("span", "k", label(k)));
      r.title = k;
      r.appendChild(el("span", "n", String(countLeaves(parent[k]))));
      r.appendChild(el("span", "arrow", "›"));
      r.onclick = () => { state.path = state.path.slice(0, depth).concat([k]); render(); };
      body.appendChild(r);
    }
    if (shown.length > ui.show) {
      const b = el("button", "more-btn", `${shown.length - ui.show} more`);
      b.onclick = () => { ui.show += PAGE; fill(); };
      body.appendChild(b);
    }
  }
  fill();
  return col;
}

// The full graph is ~4M edges; only the ego network is useful at review time,
// and it is 13.9 MB, so it loads on first function selection rather than upfront.
function ensureCallgraph(cb) {
  if (CG) return cb();
  if (!cgPending) cgPending = fetch("data/callgraph.json").then(r => r.json())
    .then(d => { CG = d.graph || {}; CG._meta = d.meta || {}; })
    .catch(() => { CG = {}; });
  cgPending.then(cb);
}

function buildCalls(fn) {
  const wrap = el("div", "calls");
  const hd = el("div", "hd");
  hd.textContent = "calls";
  wrap.appendChild(hd);
  const host = el("div", "cols");
  wrap.appendChild(host);

  ensureCallgraph(() => {
    const g = (CG || {})[fn];
    if (!g) { hd.innerHTML = `<span>calls</span><span class="none">no edges recorded</span>`; return; }
    const ins = g.in || [], outs = g.out || [];
    hd.innerHTML = `<span>calls</span>` +
      `<b>${g.in_total}</b><span>callers</span><b>${g.out_total}</b><span>callees</span>` +
      ((g.in_total > ins.length || g.out_total > outs.length)
        ? `<span class="warn">lists capped at ${Math.max(ins.length, outs.length)}</span>` : ``) +
      // graph ids are BARE NAMES, so a common accessor merges every same-named
      // function in the tree. Say so where the number would otherwise mislead.
      (g.in_total > 500 ? `<span class="warn">· generic name — callers merged across the tree</span>` : ``);

    const side = (title, arr, total) => {
      const d = el("div", "side");
      d.appendChild(el("h4", null, `${title} (${total})`));
      if (!arr.length) { d.appendChild(el("div", "none", "none")); return d; }
      for (const n of arr) {
        const r = el("div", "ln");
        r.innerHTML = `${esc(n.fn)} <small>${esc(String(n.file).split("/").pop())}</small>`;
        r.title = n.file;
        r.onclick = () => jumpTo(n.fn, n.file);
        d.appendChild(r);
      }
      return d;
    };
    host.appendChild(side("callers", ins, g.in_total));
    host.appendChild(side("callees", outs, g.out_total));
  });
  return wrap;
}

// Navigate to a neighbour if it is in the published slice set; otherwise say so
// rather than silently doing nothing — most callees live outside these 5 modules.
function jumpTo(fn, file) {
  for (const mod in TREE)
    for (const f in TREE[mod])
      if (TREE[mod][f][fn]) { state.path = [mod, f, fn]; render(); return; }
  const c = document.getElementById("crumbs");
  const note = el("span", null, ` — ${fn} is outside the published modules`);
  note.style.cssText = "color:var(--warn);font-size:11px";
  c.appendChild(note);
  setTimeout(() => note.remove(), 2600);
}

function buildClaims(list) {
  const col = el("div", "col");
  const head = el("div", "col-head");
  head.appendChild(el("span", "name", "claims"));
  head.appendChild(el("span", null, String(list.length)));
  col.appendChild(head);
  if (list[0] && list[0].fn) col.appendChild(buildCalls(list[0].fn));
  const body = el("div", "col-body");
  body.innerHTML = list.map(c => `
    <div class="claim">
      <div class="top">${tag(c.shape)}<span class="fn">${esc(c.fn)}</span>
        <span class="q">${esc(c.quant || "")}</span>
        <a class="srclink" href="${esc(srcUrl(c.file, c.line))}" target="_blank" rel="noopener">L${c.line ?? "?"} ↗</a>
      </div>
      <div class="meta">bound <b>${esc(c.bound || "—")}</b> · guard <b>${esc(c.guard || "TOP")}</b></div>
    </div>`).join("");
  col.appendChild(body);
  return col;
}

/* ── atlas ────────────────────────────────────────────────────────────────
   File-level call graph on a canvas. The unit is the FILE, not the function:
   994k function edges is a hairball, 535 published files with weighted links
   is a map. Own force sim, own layouts, no libraries.                       */
const MOD_COLORS = ["#35d0ba", "#c274e8", "#7aa2f7", "#e0af68", "#9ece6a",
                    "#f7768e", "#2ac3de", "#bb9af7", "#ff9e64", "#73daca"];
const AT = {
  raw: null, nodes: [], edges: [], byMod: new Map(), color: new Map(), off: new Set(),
  scope: "pub", layout: "atlas", minW: 1, alpha: 0, raf: 0,
  k: 1, tx: 0, ty: 0, hover: null, drawn: 0, capped: 0, ready: false,
};
const AT_CAP = 40000;   // edges drawn per frame; beyond this the picture is mush anyway

function atLoad() {
  if (AT.raw) return atBuild();
  document.getElementById("atNote").textContent = "loading data/graph.json (3.8 MB)…";
  fetch("data/graph.json").then(r => r.json()).then(d => { AT.raw = d; atBuild(); })
    .catch(e => { document.getElementById("atNote").textContent = "could not load graph.json: " + e; });
}

function atBuild() {
  const raw = AT.raw, keep = new Set();
  for (const n of raw.nodes) if (AT.scope === "all" || n.pub) keep.add(n.i);
  // In "all" scope a node earns its place by having a retained edge; isolated
  // call targets would just be noise on the rim.
  const edges = [];
  for (const [a, b, w] of raw.edges) {
    if (w < AT.minW || !keep.has(a) || !keep.has(b)) continue;
    edges.push([a, b, w]);
  }
  const live = new Set();
  for (const [a, b] of edges) { live.add(a); live.add(b); }
  const nodes = raw.nodes.filter(n => keep.has(n.i) && (live.has(n.i) || AT.scope === "pub"));
  const pos = new Map(nodes.map((n, j) => [n.i, j]));

  const deg = new Float64Array(nodes.length);
  for (const [a, b, w] of edges) {
    const x = pos.get(a), y = pos.get(b);
    if (x != null) deg[x] += w;
    if (y != null) deg[y] += w;
  }
  AT.nodes = nodes.map((n, j) => ({
    ...n, j, deg: deg[j], x: 0, y: 0, vx: 0, vy: 0,
    r: Math.max(2.2, Math.min(15, 2 + Math.sqrt(n.c || 0) * 0.85 + Math.sqrt(deg[j]) * 0.22)),
  }));
  AT.edges = edges.map(([a, b, w]) => ({ a: pos.get(a), b: pos.get(b), w }))
                  .filter(e => e.a != null && e.b != null);
  AT.edges.sort((p, q) => q.w - p.w);
  AT.capped = Math.max(0, AT.edges.length - AT_CAP);

  AT.byMod = new Map();
  for (const n of AT.nodes) {
    if (!AT.byMod.has(n.m)) AT.byMod.set(n.m, []);
    AT.byMod.get(n.m).push(n);
  }
  const mods = [...AT.byMod.keys()].sort((a, b) => AT.byMod.get(b).length - AT.byMod.get(a).length);
  AT.color = new Map(mods.map((m, i) => [m, MOD_COLORS[i % MOD_COLORS.length]]));
  AT.ready = true;
  if (AT.needFit) AT.needFit();     // a new scope deserves a fresh viewport
  atLegend(mods);
  atLayout();
  atNote();
}

function atLegend(mods) {
  const host = document.getElementById("atLegend");
  host.textContent = "";
  for (const m of mods.slice(0, 12)) {
    const d = el("div", AT.off.has(m) ? "off" : null);
    const i = el("i"); i.style.background = AT.color.get(m);
    d.appendChild(i);
    d.appendChild(el("span", null, `${m} (${AT.byMod.get(m).length})`));
    d.onclick = () => { AT.off.has(m) ? AT.off.delete(m) : AT.off.add(m); atLegend(mods); atDraw(); };
    host.appendChild(d);
  }
}

// Deterministic layouts settle instantly; force is opt-in because on the full
// scope it has thousands of bodies to move.
function atLayout() {
  const N = AT.nodes;
  if (!N.length) return atDraw();
  if (AT.layout === "grid") {
    const cols = Math.ceil(Math.sqrt(N.length));
    const sorted = [...N].sort((a, b) => a.m < b.m ? -1 : a.m > b.m ? 1 : (a.f < b.f ? -1 : 1));
    sorted.forEach((n, i) => { n.x = (i % cols) * 26 - cols * 13; n.y = Math.floor(i / cols) * 26 - cols * 13; });
  } else {
    // atlas: modules on a ring, each a phyllotaxis disc with its hubs at centre.
    // Arc is allocated by disc radius, not per-module equally — with one module
    // 260× another, equal slices let the big continent swallow the map.
    const C = 9;                                   // phyllotaxis constant ⇒ uniform density
    const mods = [...AT.byMod.entries()].sort((a, b) => b[1].length - a[1].length)
      .map(([m, list]) => ({ m, list, rad: C * Math.sqrt(list.length) + 12 }));
    const sum = mods.reduce((t, d) => t + d.rad, 0);
    const maxR = Math.max(...mods.map(d => d.rad));
    const R = Math.max(140, maxR * 2.0, sum * 2 * 1.15 / (Math.PI * 2));
    let acc = 0;
    for (const d of mods) {
      const a = (acc + d.rad / 2) / sum * Math.PI * 2 - Math.PI / 2;
      acc += d.rad;
      const cx = Math.cos(a) * R, cy = Math.sin(a) * R;
      [...d.list].sort((p, q) => q.deg - p.deg).forEach((n, i) => {
        const t = i * 2.399963229728653, rr = C * Math.sqrt(i + 0.5);
        n.x = cx + Math.cos(t) * rr; n.y = cy + Math.sin(t) * rr;
      });
    }
    if (AT.layout === "force") { AT.alpha = 1; atRun(); return; }
  }
  AT.alpha = 0;
  atFit();
}

function atTick() {
  const N = AT.nodes, E = AT.edges, a = AT.alpha;
  const CELL = 46, REP = 900, LINK = 34;
  const buckets = new Map();
  for (const n of N) {
    const key = ((n.x / CELL) | 0) + "," + ((n.y / CELL) | 0);
    let b = buckets.get(key); if (!b) buckets.set(key, b = []);
    b.push(n);
  }
  for (const n of N) { n.vx *= 0.84; n.vy *= 0.84; }
  // Repulsion only within the 3×3 cell neighbourhood — O(n·k) instead of O(n²),
  // which is what makes the 4,687-node scope movable at all.
  for (const n of N) {
    const cx = (n.x / CELL) | 0, cy = (n.y / CELL) | 0;
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
      const b = buckets.get((cx + i) + "," + (cy + j));
      if (!b) continue;
      for (const m of b) {
        if (m === n) continue;
        let dx = n.x - m.x, dy = n.y - m.y, d2 = dx * dx + dy * dy;
        if (d2 > CELL * CELL * 4) continue;
        if (d2 < 0.01) { dx = ((n.j % 7) - 3) * 0.3; dy = ((n.j % 5) - 2) * 0.3; d2 = 0.5; }
        const f = (REP / d2) * a;
        n.vx += dx * f; n.vy += dy * f;
      }
    }
  }
  for (const e of E) {
    const p = N[e.a], q = N[e.b];
    let dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - LINK) * 0.012 * Math.min(3, Math.log2(1 + e.w)) * a / d;
    dx *= f; dy *= f;
    p.vx += dx; p.vy += dy; q.vx -= dx; q.vy -= dy;
  }
  for (const n of N) {
    n.vx -= n.x * 0.0022 * a; n.vy -= n.y * 0.0022 * a;   // gravity
    n.x += Math.max(-9, Math.min(9, n.vx));
    n.y += Math.max(-9, Math.min(9, n.vy));
  }
  AT.alpha *= 0.9835;
}

function atRun() {
  cancelAnimationFrame(AT.raf);
  const step = () => {
    if (AT.alpha > 0.008) { atTick(); atDraw(); atNote(); AT.raf = requestAnimationFrame(step); }
    else { AT.alpha = 0; atDraw(); atNote(); }
  };
  atFit(); step();
}

function atFit() {
  const c = document.getElementById("cnv");
  const N = AT.nodes.filter(n => !AT.off.has(n.m));
  if (!N.length || !c.clientWidth) return atDraw();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of N) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const pad = 40;
  AT.k = Math.min((c.clientWidth - pad * 2) / Math.max(1, x1 - x0),
                  (c.clientHeight - pad * 2) / Math.max(1, y1 - y0));
  AT.k = Math.max(0.05, Math.min(6, AT.k));
  AT.tx = c.clientWidth / 2 - ((x0 + x1) / 2) * AT.k;
  AT.ty = c.clientHeight / 2 - ((y0 + y1) / 2) * AT.k;
  atDraw();
}

function atDraw() {
  const c = document.getElementById("cnv");
  if (!c.clientWidth) return;
  const dpr = window.devicePixelRatio || 1;
  if (c.width !== c.clientWidth * dpr || c.height !== c.clientHeight * dpr) {
    c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, c.clientWidth, c.clientHeight);
  if (!AT.ready) return;
  const { k, tx, ty } = AT, N = AT.nodes;
  const X = n => n.x * k + tx, Y = n => n.y * k + ty;
  const vis = n => !AT.off.has(n.m);
  const h = AT.hover;
  const inc = h ? new Set() : null;

  g.lineWidth = 1;
  let drawn = 0;
  for (const e of AT.edges) {
    if (drawn >= AT_CAP) break;
    const p = N[e.a], q = N[e.b];
    if (!vis(p) || !vis(q)) continue;
    const touch = h && (p === h || q === h);
    if (h && !touch) continue;          // hovering isolates the file's own calls
    if (touch) { inc.add(p); inc.add(q); }
    drawn++;
    // Alpha has to stay low: tens of thousands of overlapping strokes accumulate,
    // and anything more generous turns the whole field into fog.
    g.strokeStyle = touch ? (p === h ? "rgba(53,208,186,.85)" : "rgba(194,116,232,.85)")
                          : `rgba(122,134,153,${Math.min(0.34, 0.025 + e.w / 260)})`;
    g.lineWidth = touch ? 1.4 : 1;
    g.beginPath(); g.moveTo(X(p), Y(p)); g.lineTo(X(q), Y(q)); g.stroke();
  }
  AT.drawn = drawn;

  for (const n of N) {
    if (!vis(n)) continue;
    const x = X(n), y = Y(n), r = Math.max(1.4, n.r * Math.min(1.6, Math.sqrt(k)));
    if (x < -30 || y < -30 || x > c.clientWidth + 30 || y > c.clientHeight + 30) continue;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832);
    g.fillStyle = n.pub ? AT.color.get(n.m) : "#2b3648";
    g.globalAlpha = h ? (n === h || inc.has(n) ? 1 : 0.16) : (n.pub ? 0.92 : 0.5);
    g.fill();
    if (n === h) { g.globalAlpha = 1; g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke(); }
  }
  g.globalAlpha = 1;

  // Labels are rationed twice over: by rank (busiest files first) and by a
  // coarse occupancy grid, so zooming out thins the text instead of stacking it
  // into a smear. Hover always wins a label.
  g.font = "10px ui-monospace, Menlo, monospace";
  g.textAlign = "center"; g.textBaseline = "bottom";
  const budget = k > 2.5 ? 400 : k > 1.2 ? 120 : k > 0.6 ? 45 : 16;
  const placed = [];
  const rank = h ? [h, ...[...inc].filter(n => n !== h)]
                 : [...N].sort((p, q) => q.deg - p.deg);
  let used = 0;
  for (const n of rank) {
    if (used >= budget && n !== h) break;
    if (!vis(n)) continue;
    const x = X(n), y = Y(n) - n.r * Math.min(1.6, Math.sqrt(k)) - 2;
    if (x < 0 || y < 8 || x > c.clientWidth || y > c.clientHeight) continue;
    const txt = n.f.split("/").pop();
    const w = g.measureText(txt).width + 6, r = [x - w / 2, y - 11, x + w / 2, y + 1];
    if (n !== h && placed.some(p => r[0] < p[2] && r[2] > p[0] && r[1] < p[3] && r[3] > p[1])) continue;
    placed.push(r); used++;
    g.globalAlpha = n === h ? 1 : h ? 0.75 : 0.82;
    g.fillStyle = n === h ? "#fff" : "#cdd6e4";
    g.fillText(txt, x, y);
  }
  g.globalAlpha = 1;
}

function atNote() {
  const n = AT.nodes.length, e = AT.edges.length, m = (AT.raw && AT.raw.meta) || {};
  document.getElementById("atNote").innerHTML =
    `<b>${n}</b> files · <b>${e.toLocaleString()}</b> links` +
    (AT.capped ? ` <span style="color:var(--warn)">(top ${AT_CAP.toLocaleString()} drawn)</span>` : ``) +
    (AT.alpha ? ` · sim α=${AT.alpha.toFixed(3)}` : ``) +
    `<br>files aggregated from <b>${(m.function_edges || 0).toLocaleString()}</b> function calls; ` +
    `link weight = distinct calls between two files. ` +
    (AT.scope === "all"
      ? `grey nodes are call targets outside the five analysed modules — no claims of their own.`
      : `showing only files carrying published claims.`) +
    `<br>drag to pan · wheel to zoom · hover isolates a file's calls · click opens it in browse.`;
}

(function atWire() {
  const sl = document.getElementById("atMinW");
  const mk = (host, opts, get, set) => {
    const h = document.getElementById(host);
    h.textContent = "";
    for (const [val, label] of opts) {
      const b = el("button", get() === val ? "on" : null, label);
      b.onclick = () => { set(val); [...h.children].forEach(c => c.classList.remove("on")); b.classList.add("on"); };
      h.appendChild(b);
    }
  };
  mk("atScope", [["pub", "published"], ["all", "+ call targets"]],
     () => AT.scope, v => {
       AT.scope = v; AT.hover = null;
       // 4,686 files at every weight is fog; open the wide scope on a threshold
       // that leaves a readable map, and let the slider take it from there.
       const d = v === "all" ? 6 : 1;
       AT.minW = d; sl.value = d; document.getElementById("atMinWv").textContent = d;
       atBuild();
     });
  mk("atLayout", [["atlas", "atlas"], ["force", "force"], ["grid", "grid"]],
     () => AT.layout, v => { AT.layout = v; atLayout(); });
  sl.oninput = () => {
    document.getElementById("atMinWv").textContent = sl.value;
    AT.minW = +sl.value; AT.hover = null; atBuild();
  };
  document.getElementById("atFit").onclick = atFit;

  const c = document.getElementById("cnv");
  let dragging = false, lx = 0, ly = 0, moved = 0;
  c.addEventListener("mousedown", e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; c.classList.add("drag"); });
  addEventListener("mouseup", () => { dragging = false; c.classList.remove("drag"); });
  c.addEventListener("mousemove", e => {
    const b = c.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    if (dragging) {
      moved += Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly);
      AT.tx += e.clientX - lx; AT.ty += e.clientY - ly;
      lx = e.clientX; ly = e.clientY; atDraw(); return;
    }
    const hit = atHit(mx, my);
    if (hit !== AT.hover) { AT.hover = hit; atDraw(); }
    const tip = document.getElementById("atTip");
    if (!hit) { tip.style.display = "none"; return; }
    tip.style.display = "block";
    tip.innerHTML = `<div class="t">${esc(hit.f)}</div><div class="d">` +
      (hit.pub ? `<b>${hit.c}</b> claims · mostly <b>${esc(hit.top || "—")}</b> · ` : `no claims (outside the analysed modules) · `) +
      `<b>${hit.deg.toLocaleString()}</b> weighted calls` + (hit.s ? ` · <b>${hit.s}</b> internal` : ``) +
      (hit.pub ? `<br>click to open in browse` : ``) + `</div>`;
    tip.style.left = Math.min(mx + 14, c.clientWidth - 350) + "px";
    tip.style.top = Math.min(my + 14, c.clientHeight - 70) + "px";
  });
  c.addEventListener("mouseleave", () => {
    AT.hover = null; document.getElementById("atTip").style.display = "none"; atDraw();
  });
  c.addEventListener("click", e => {
    if (moved > 4) return;
    const b = c.getBoundingClientRect();
    const hit = atHit(e.clientX - b.left, e.clientY - b.top);
    if (hit && hit.pub && TREE[hit.m] && TREE[hit.m][hit.f]) {
      state.path = [hit.m, hit.f]; showTab("browse"); render();
    }
  });
  // The canvas can be laid out at zero size (tab opened in the background, pane
  // hidden), and a fit computed then leaves the map parked off-screen. Watch the
  // box instead of guessing: fit the first time it has real size, redraw after.
  let fitted = false;
  new ResizeObserver(() => {
    if (!AT.ready || !c.clientWidth) return;
    if (!fitted) { fitted = true; atFit(); } else atDraw();
  }).observe(document.getElementById("atlas"));
  AT.needFit = () => { fitted = false; };

  c.addEventListener("wheel", e => {
    e.preventDefault();
    const b = c.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    const f = Math.exp(-e.deltaY * 0.0016), nk = Math.max(0.03, Math.min(14, AT.k * f));
    AT.tx = mx - (mx - AT.tx) * (nk / AT.k);
    AT.ty = my - (my - AT.ty) * (nk / AT.k);
    AT.k = nk; atDraw();
  }, { passive: false });
  addEventListener("resize", () => { if (AT.ready) atDraw(); });
})();

function atHit(mx, my) {
  let best = null, bd = 15 * 15;
  for (const n of AT.nodes) {
    if (AT.off.has(n.m)) continue;
    const dx = n.x * AT.k + AT.tx - mx, dy = n.y * AT.k + AT.ty - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}

const TABS = {
  browse: { tab: "tabBrowse", show: ["columns", "crumbs"] },
  atlas:  { tab: "tabAtlas",  show: ["atlas"] },
  twins:  { tab: "tabTwins",  show: ["twins"] },
};
function showTab(name) {
  for (const [k, t] of Object.entries(TABS)) {
    document.getElementById(t.tab).classList.toggle("on", k === name);
    for (const id of t.show)
      document.getElementById(id).style.display =
        k !== name ? "none" : (id === "columns" ? "flex" : id === "crumbs" ? "flex" : "block");
  }
  if (name === "atlas") { atLoad(); requestAnimationFrame(() => AT.ready ? atFit() : null); }
  if (name === "twins") loadTwins();
}
for (const [k, t] of Object.entries(TABS))
  document.getElementById(t.tab).onclick = e => { e.preventDefault(); showTab(k); };

let TWINS = null;
function loadTwins() {
  const host = document.getElementById("twins");
  if (TWINS) return;
  fetch("data/twins.json").then(r => r.json()).then(d => {
    TWINS = d;
    const m = d.meta || {};
    host.innerHTML =
      `<div class="banner">A shared signature is <b>evidence of similarity, not a duplicate</b> —
       two functions posting the same shape·bound·quant books do mechanically the same thing, but may
       be entirely different code. Over-produces by design; open the source to judge.
       <b>${m.groups}</b> groups · <b>${m.functions_in_groups}</b> functions ·
       <b>${m.removable_loc_total}</b> LOC if every group collapsed to one implementation.</div>` +
      (d.twins || []).slice(0, 150).map(t => `
        <div class="tw">
          <div class="hd">
            <span class="cnt">×${t.count}</span>
            <span class="loc">${t.removable_loc} LOC removable</span>
            <span style="color:var(--text-dim)">of ${t.total_loc}</span>
            <span style="margin-left:auto;color:var(--text-dim)">${t.sig_len} claims in signature</span>
          </div>
          <div class="sig">${t.signature.map(s => tag(s.shape) +
              `<span style="color:var(--text-dim)">${esc(s.bound || "")}</span>`).join(" ")}</div>
          <div class="mem">
            ${t.members.map(mm => `
              <span class="fn">${esc(mm.fn)} <small>${esc(mm.file)}</small></span>
              <span class="num">${mm.loc} loc</span>
              <span class="num">${mm.callers} callers</span>
              <a href="${esc(srcUrl(mm.file, mm.line))}" target="_blank" rel="noopener">L${mm.line ?? "?"} ↗</a>`).join("")}
          </div>
        </div>`).join("");
  });
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.path.length) {
    state.path.pop(); render();
  }
});
</script>
</body>
</html>
