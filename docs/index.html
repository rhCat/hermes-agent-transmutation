<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hermes-agent // mechanical transmutation</title>
<style>
  :root {
    --bg: #0b0e14; --bg-panel: #10141d; --bg-col: #0e1219;
    --bg-row-hover: #1a2130; --bg-row-sel: #1d2a3f;
    --border: #1f2735; --text: #cdd6e4; --text-dim: #7a8699;
    --accent: #35d0ba; --accent2: #c274e8; --num: #e5b567;
    --str: #9ece6a; --bool: #7aa2f7; --nul: #f7768e;
    --err: #f7768e; --warn: #e0af68; --info: #7aa2f7; --ok: #9ece6a;
    font-size: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel); flex: none;
  }
  header .logo { color: var(--accent); font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  header .logo span { color: var(--accent2); }
  header .src { color: var(--text-dim); font-size: 12px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header a { color: var(--text-dim); text-decoration: none; font-size: 12px; }
  header a:hover { color: var(--accent); }

  .stats { display: flex; gap: 0; border-bottom: 1px solid var(--border);
           background: var(--bg-panel); flex: none; overflow-x: auto; }
  .stat { padding: 10px 16px; border-right: 1px solid var(--border); min-width: 120px; }
  .stat .k { color: var(--text-dim); font-size: 11px; text-transform: lowercase; }
  .stat .v { color: var(--num); font-size: 20px; font-weight: 700; margin-top: 2px; }
  .stat .v.ok { color: var(--ok); }
  .stat .v.warn { color: var(--warn); }

  main { flex: 1; display: flex; min-height: 0; }
  .panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .panel + .panel { border-left: 1px solid var(--border); }
  .panel h2 {
    margin: 0; padding: 7px 12px; font-size: 11px; font-weight: 600;
    color: var(--text-dim); text-transform: lowercase; letter-spacing: .5px;
    border-bottom: 1px solid var(--border); background: var(--bg-col); flex: none;
  }
  .panel h2 b { color: var(--accent); font-weight: 600; }
  .scroll { overflow-y: auto; flex: 1; min-height: 0; }

  #shapes { flex: 0 0 260px; }
  #mods   { flex: 0 0 190px; }
  #files  { flex: 0 0 380px; }
  #claims { flex: 1; }

  .row {
    display: flex; align-items: baseline; gap: 8px; padding: 4px 12px;
    cursor: pointer; border-bottom: 1px solid rgba(31,39,53,.4); font-size: 12px;
  }
  .row:hover { background: var(--bg-row-hover); }
  .row.sel { background: var(--bg-row-sel); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n { color: var(--num); font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--accent); opacity: .5; margin-top: 3px; }

  .claim { padding: 6px 12px; border-bottom: 1px solid rgba(31,39,53,.4); font-size: 12px; }
  .claim:hover { background: var(--bg-row-hover); }
  .claim .top { display: flex; gap: 8px; align-items: baseline; }
  .claim .fn { color: var(--str); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .claim .meta { color: var(--text-dim); font-size: 11px; margin-top: 2px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700;
         white-space: nowrap; flex: none; }
  .q { color: var(--text-dim); font-size: 10px; flex: none; }

  .empty { padding: 24px 12px; color: var(--text-dim); font-size: 12px; line-height: 1.6; }
  input.filter {
    width: 100%; background: var(--bg); color: var(--text); border: none;
    border-bottom: 1px solid var(--border); font: inherit; font-size: 12px;
    padding: 6px 12px; outline: none; flex: none;
  }
  input.filter::placeholder { color: var(--text-dim); }
  footer {
    flex: none; padding: 6px 14px; border-top: 1px solid var(--border);
    background: var(--bg-panel); color: var(--text-dim); font-size: 11px;
  }
  footer b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo">alembic<span>//</span>transmutation</div>
  <div class="src" id="src">loading…</div>
  <div class="spacer"></div>
  <a href="https://github.com/NousResearch/hermes-agent" target="_blank" rel="noopener">source repo ↗</a>
</header>

<div class="stats" id="stats"></div>

<main>
  <section class="panel" id="mods">
    <h2>module <b id="modCount"></b></h2>
    <div class="scroll" id="modList"></div>
  </section>
  <section class="panel" id="shapes">
    <h2>shape <b id="shapeCount"></b></h2>
    <div class="scroll" id="shapeList"></div>
  </section>
  <section class="panel" id="files">
    <h2>file <b id="fileCount"></b></h2>
    <input class="filter" id="fileFilter" placeholder="filter files…" autocomplete="off">
    <div class="scroll" id="fileList"></div>
  </section>
  <section class="panel" id="claims">
    <h2>claims <b id="claimCount"></b></h2>
    <input class="filter" id="claimFilter" placeholder="filter by function…" autocomplete="off">
    <div class="scroll" id="claimList"></div>
  </section>
</main>

<footer id="foot"></footer>

<script>
const SHAPE_COLOR = {
  ACQUIRE:  ["#1a2f26", "#9ece6a"], RELEASE: ["#1a2f26", "#9ece6a"],
  TRANSFER: ["#1a2f26", "#9ece6a"], RAISE:   ["#33222a", "#f7768e"],
  GATE:     ["#2a2333", "#c274e8"], ABSORB:  ["#2a2333", "#c274e8"],
  ALTER_STATE: ["#332b1c", "#e0af68"], RETURN: ["#1c2733", "#7aa2f7"],
  NO_EFFECT: ["#1e232b", "#7a8699"],
};
const tag = s => {
  const [bg, fg] = SHAPE_COLOR[s] || ["#1e232b", "#7a8699"];
  return `<span class="tag" style="background:${bg};color:${fg}">${s}</span>`;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shortFile = f => String(f || "").replace(/^.*?\/(?=[^/]+\/[^/]+$)/, "");

let CLAIMS = [], META = {}, selShape = null, selFile = null, selMod = null;

fetch("data/summary.json").then(r => r.json()).then(d => {
  META = d.meta || {};
  CLAIMS = d.claims || [];
  render();
}).catch(e => {
  document.getElementById("claimList").innerHTML =
    `<div class="empty">could not load <b>data/summary.json</b><br>${esc(e)}</div>`;
});

function render() {
  const m = META;
  document.getElementById("src").textContent =
    `${m.repo || "?"} @ ${(m.commit || "").slice(0, 12)}`;

  const degraded = (m.degradations || []).length;
  const stats = [
    ["functions", m.functions, ""],
    ["claims", m.claims, ""],
    ["files", m.files, ""],
    ["flows", m.flows, ""],
    ["acquire", m.acquire ?? 0, (m.acquire ? "ok" : "warn")],
    ["release", m.release ?? 0, (m.release ? "ok" : "warn")],
    ["llm calls", m.llm_calls ?? 0, "ok"],
    ["degradations", degraded, degraded ? "warn" : "ok"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([k, v, cls]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v ${cls}">${v ?? "—"}</div></div>`).join("");

  const mods = m.by_module || {};
  const maxMod = Math.max(...Object.values(mods), 1);
  document.getElementById("modCount").textContent = Object.keys(mods).length;
  document.getElementById("modList").innerHTML = Object.entries(mods)
    .sort((a, b) => b[1] - a[1]).map(([k, n]) => `
      <div class="row" data-mod="${esc(k)}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:8px"><span class="name">${esc(k)}</span>
          <span class="n">${n}</span></div>
          <div class="bar" style="width:${(n / maxMod * 100).toFixed(1)}%"></div>
        </div>
      </div>`).join("");

  const byShape = {}, byFile = {};
  for (const c of CLAIMS) {
    byShape[c.shape] = (byShape[c.shape] || 0) + 1;
    byFile[c.file] = (byFile[c.file] || 0) + 1;
  }
  const maxShape = Math.max(...Object.values(byShape), 1);
  document.getElementById("shapeCount").textContent = Object.keys(byShape).length;
  document.getElementById("shapeList").innerHTML = Object.entries(byShape)
    .sort((a, b) => b[1] - a[1]).map(([s, n]) => `
      <div class="row" data-shape="${esc(s)}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:8px"><span class="name">${tag(s)}</span>
          <span class="n">${n}</span></div>
          <div class="bar" style="width:${(n / maxShape * 100).toFixed(1)}%"></div>
        </div>
      </div>`).join("");

  window.FILES = Object.entries(byFile).sort((a, b) => b[1] - a[1]);
  document.getElementById("fileCount").textContent = window.FILES.length;
  drawFiles(""); drawClaims("");

  document.getElementById("foot").innerHTML =
    `mechanical only — <b>llm_calls ${m.llm_calls ?? 0}</b>, <b>docs_read ${m.docs_read}</b>. ` +
    `channels: <b>${(m.channels || []).join(" · ")}</b>. ` +
    `scope: <b>${esc(m.analysed || "")}</b>. ` +
    (degraded ? `<span style="color:var(--warn)">degradations: ${esc((m.degradations || []).join("; "))}</span>`
              : `no degradations — every channel present.`);
}

function drawFiles(q) {
  const rows = window.FILES.filter(([f]) => !q || f.toLowerCase().includes(q));
  const max = Math.max(...rows.map(r => r[1]), 1);
  document.getElementById("fileList").innerHTML = rows.slice(0, 400).map(([f, n]) => `
    <div class="row ${selFile === f ? "sel" : ""}" data-file="${esc(f)}">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px">
          <span class="name" title="${esc(f)}">${esc(shortFile(f))}</span>
          <span class="n">${n}</span></div>
        <div class="bar" style="width:${(n / max * 100).toFixed(1)}%"></div>
      </div>
    </div>`).join("") || `<div class="empty">no file matches</div>`;
}

function drawClaims(q) {
  let rows = CLAIMS;
  if (selMod) rows = rows.filter(c => c.module === selMod);
  if (selShape) rows = rows.filter(c => c.shape === selShape);
  if (selFile) rows = rows.filter(c => c.file === selFile);
  if (q) rows = rows.filter(c => (c.fn || "").toLowerCase().includes(q));
  document.getElementById("claimCount").textContent = rows.length;
  document.getElementById("claimList").innerHTML = rows.slice(0, 600).map(c => `
    <div class="claim">
      <div class="top">${tag(c.shape)}<span class="fn">${esc(c.fn)}</span>
        <span class="q">${esc(c.quant || "")}</span></div>
      <div class="meta">${esc(c.bound || "")} · ${esc(shortFile(c.file))}${c.line ? ":" + c.line : ""}
        · guard ${esc(c.guard || "TOP")}</div>
    </div>`).join("") || `<div class="empty">no claim matches</div>`;
  if (rows.length > 600)
    document.getElementById("claimList").insertAdjacentHTML("beforeend",
      `<div class="empty">…${rows.length - 600} more. narrow with a filter.</div>`);
}

document.getElementById("modList").addEventListener("click", e => {
  const r = e.target.closest("[data-mod]"); if (!r) return;
  selMod = selMod === r.dataset.mod ? null : r.dataset.mod;
  document.querySelectorAll("#modList .row").forEach(x =>
    x.classList.toggle("sel", x.dataset.mod === selMod));
  drawClaims(document.getElementById("claimFilter").value.toLowerCase());
});
document.getElementById("shapeList").addEventListener("click", e => {
  const r = e.target.closest("[data-shape]"); if (!r) return;
  selShape = selShape === r.dataset.shape ? null : r.dataset.shape;
  document.querySelectorAll("#shapeList .row").forEach(x =>
    x.classList.toggle("sel", x.dataset.shape === selShape));
  drawClaims(document.getElementById("claimFilter").value.toLowerCase());
});
document.getElementById("fileList").addEventListener("click", e => {
  const r = e.target.closest("[data-file]"); if (!r) return;
  selFile = selFile === r.dataset.file ? null : r.dataset.file;
  drawFiles(document.getElementById("fileFilter").value.toLowerCase());
  drawClaims(document.getElementById("claimFilter").value.toLowerCase());
});
document.getElementById("fileFilter").addEventListener("input", e =>
  drawFiles(e.target.value.toLowerCase()));
document.getElementById("claimFilter").addEventListener("input", e =>
  drawClaims(e.target.value.toLowerCase()));
</script>
</body>
</html>
