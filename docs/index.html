<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hermes-agent // mechanical transmutation</title>
<style>
  :root {
    --bg: #0b0e14; --bg-panel: #10141d; --bg-col: #0e1219;
    --bg-row-hover: #1a2130; --bg-row-sel: #1d2a3f;
    --border: #1f2735; --text: #cdd6e4; --text-dim: #7a8699;
    --accent: #35d0ba; --accent2: #c274e8; --num: #e5b567;
    --str: #9ece6a; --key: #8fb8e8;
    --err: #f7768e; --warn: #e0af68; --info: #7aa2f7; --ok: #9ece6a;
    font-size: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); background: var(--bg-panel); flex: none;
  }
  header .logo { color: var(--accent); font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  header .logo span { color: var(--accent2); }
  header .src { color: var(--text-dim); font-size: 12px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header a { color: var(--text-dim); text-decoration: none; font-size: 12px; white-space: nowrap; }
  header a:hover { color: var(--accent); }
  header a.tab { padding: 2px 9px; border: 1px solid var(--border); border-radius: 4px; }
  header a.tab.on { color: var(--accent); border-color: var(--accent); }

  #twins { flex: 1; overflow-y: auto; display: none; padding: 0 0 24px; }
  .tw { border-bottom: 1px solid var(--border); padding: 9px 14px; }
  .tw .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tw .cnt { color: var(--accent); font-weight: 700; }
  .tw .loc { color: var(--num); font-variant-numeric: tabular-nums; }
  .tw .sig { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
  .tw .mem { margin-top: 6px; display: grid;
             grid-template-columns: minmax(0,1fr) auto auto auto; gap: 2px 12px; font-size: 11.5px; }
  .tw .mem .fn { color: var(--str); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tw .mem .fn small { color: var(--text-dim); }
  .tw .mem .num { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .tw .mem a { color: var(--info); text-decoration: none; }
  .tw .mem a:hover { color: var(--accent); text-decoration: underline; }
  .banner { padding: 8px 14px; color: var(--warn); font-size: 11.5px;
            border-bottom: 1px solid var(--border); background: var(--bg-col); }

  .stats { display: flex; border-bottom: 1px solid var(--border);
           background: var(--bg-panel); flex: none; overflow-x: auto; }
  .stat { padding: 8px 16px; border-right: 1px solid var(--border); min-width: 108px; }
  .stat .k { color: var(--text-dim); font-size: 11px; }
  .stat .v { color: var(--num); font-size: 19px; font-weight: 700; margin-top: 1px; }
  .stat .v.ok { color: var(--ok); } .stat .v.warn { color: var(--warn); }

  #crumbs {
    flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 14px;
    border-bottom: 1px solid var(--border); background: var(--bg-col);
    font-size: 12px; color: var(--text-dim); overflow-x: auto; white-space: nowrap;
  }
  #crumbs .c { color: var(--accent); cursor: pointer; }
  #crumbs .c:hover { text-decoration: underline; }
  #crumbs .sep { color: var(--text-dim); }

  #columns { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; min-width: 0; }
  .col {
    flex: none; width: 300px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--bg-col); min-height: 0;
  }
  .col:last-child { flex: 1; min-width: 340px; }
  .col-head {
    flex: none; padding: 6px 10px 4px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim); display: flex; align-items: baseline; gap: 6px;
    overflow: hidden; white-space: nowrap;
  }
  .col-head .name { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  .col-filter { margin: 6px 8px; }
  .col-filter input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font: inherit; font-size: 12px; padding: 3px 8px; outline: none;
  }
  .col-filter input:focus { border-color: var(--accent); }
  .col-body { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 20px; }

  .row {
    display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer;
    font-size: 12.5px; white-space: nowrap; overflow: hidden;
    border-left: 2px solid transparent;
  }
  .row:hover { background: var(--bg-row-hover); }
  .row.sel { background: var(--bg-row-sel); border-left-color: var(--accent); }
  .row .k { color: var(--key); overflow: hidden; text-overflow: ellipsis; }
  .row.sel .k { color: var(--accent); }
  .row .n { color: var(--num); flex: none; font-variant-numeric: tabular-nums; }
  .row .arrow { margin-left: auto; color: var(--text-dim); flex: none; }
  .col-empty { padding: 12px 10px; color: var(--text-dim); font-size: 12px; }
  .more-btn {
    margin: 6px 8px; width: calc(100% - 16px); background: #16202e; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font: inherit; font-size: 12px;
    padding: 3px 8px; cursor: pointer;
  }

  .ego { border-bottom: 1px solid var(--border); background: var(--bg); }
  .ego .hd { padding: 5px 10px; font-size: 11px; color: var(--text-dim);
             display: flex; gap: 8px; align-items: baseline; }
  .ego .hd b { color: var(--accent); font-weight: 600; }
  .ego .warn { color: var(--warn); }
  .ego svg { display: block; width: 100%; }
  .ego text { font: 10px "SF Mono", Menlo, monospace; }
  .ego text.c { fill: var(--text); cursor: pointer; }
  .ego text.c:hover { fill: var(--accent); text-decoration: underline; }
  .ego text.mid { fill: var(--accent); font-weight: 700; }
  .ego text.dim { fill: var(--text-dim); }
  .ego line { stroke: #2b3648; }
  .claim { padding: 7px 10px; border-bottom: 1px solid rgba(31,39,53,.5); font-size: 12px; }
  .claim .top { display: flex; gap: 7px; align-items: baseline; }
  .claim .fn { color: var(--str); overflow: hidden; text-overflow: ellipsis; }
  .claim .meta { color: var(--text-dim); font-size: 11px; margin-top: 3px; }
  .claim .meta b { color: var(--text); font-weight: 400; }
  .claim a.srclink { color: var(--info); text-decoration: none; margin-left: auto; flex: none; font-size: 11px; }
  .claim a.srclink:hover { color: var(--accent); text-decoration: underline; }
  .tag { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700;
         white-space: nowrap; flex: none; }
  .q { color: var(--text-dim); font-size: 10px; flex: none; }

  footer {
    flex: none; padding: 6px 14px; border-top: 1px solid var(--border);
    background: var(--bg-panel); color: var(--text-dim); font-size: 11px;
    white-space: nowrap; overflow-x: auto;
  }
  footer b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo">alembic<span>//</span>transmutation</div>
  <div class="src" id="src">loading…</div>
  <div class="spacer"></div>
  <a href="#" id="tabBrowse" class="tab on">browse</a>
  <a href="#" id="tabTwins" class="tab">similar functions</a>
  <a href="https://github.com/rhCat/hermes-agent-transmutation" target="_blank" rel="noopener">method ↗</a>
  <a href="https://github.com/NousResearch/hermes-agent" target="_blank" rel="noopener">source ↗</a>
</header>

<div class="stats" id="stats"></div>
<div id="crumbs"></div>
<div id="columns"></div>
<div id="twins"></div>
<footer id="foot"></footer>

<script>
const PAGE = 200;
const SHAPE_COLOR = {
  ACQUIRE: ["#1a2f26", "#9ece6a"], RELEASE: ["#1a2f26", "#9ece6a"],
  TRANSFER: ["#1a2f26", "#9ece6a"], RAISE: ["#33222a", "#f7768e"],
  GATE: ["#2a2333", "#c274e8"], ABSORB: ["#2a2333", "#c274e8"],
  ALTER_STATE: ["#332b1c", "#e0af68"], RETURN: ["#1c2733", "#7aa2f7"],
  NO_EFFECT: ["#1e232b", "#7a8699"],
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tag = s => {
  const [bg, fg] = SHAPE_COLOR[s] || ["#1e232b", "#7a8699"];
  return `<span class="tag" style="background:${bg};color:${fg}">${esc(s)}</span>`;
};
const el = (t, cls, txt) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

let META = {}, TREE = {}, CLAIMS = [], CG = null, cgPending = null;
// path = [module, file, function] — the drill-down, one segment per column
const state = { path: [], colUI: {} };

// Every claim carries file+line, so each is one click from the exact source line
// at the analysed commit. A review panel that cannot reach the code is a list.
function srcUrl(file, line) {
  const base = `https://github.com/${META.repo}/blob/${META.commit}/${file}`;
  return line ? `${base}#L${line}` : base;
}

fetch("data/summary.json").then(r => r.json()).then(d => {
  META = d.meta || {};
  CLAIMS = d.claims || [];
  for (const c of CLAIMS) {
    const m = (TREE[c.module] ||= {});
    const f = (m[c.file] ||= {});
    (f[c.fn] ||= []).push(c);
  }
  renderChrome();
  render();
}).catch(e => {
  document.getElementById("columns").innerHTML =
    `<div class="col-empty">could not load <b>data/summary.json</b><br>${esc(e)}</div>`;
});

function renderChrome() {
  const m = META;
  document.getElementById("src").textContent =
    `${m.repo || "?"} @ ${(m.commit || "").slice(0, 12)}`;
  const deg = (m.degradations || []).length;
  const stats = [
    ["functions", m.functions, ""], ["claims", m.claims, ""],
    ["files", m.files, ""], ["modules", (m.modules || []).length, ""],
    ["acquire", m.acquire ?? 0, m.acquire ? "ok" : "warn"],
    ["release", m.release ?? 0, m.release ? "ok" : "warn"],
    ["llm calls", m.llm_calls ?? 0, "ok"],
    ["degradations", deg, deg ? "warn" : "ok"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([k, v, c]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v ?? "—"}</div></div>`).join("");
  document.getElementById("foot").innerHTML =
    `mechanical only — <b>llm_calls ${m.llm_calls ?? 0}</b>, <b>docs_read ${m.docs_read}</b>. ` +
    `channels <b>${(m.channels || []).join(" · ")}</b>. ` +
    (deg ? `<span style="color:var(--warn)">degradations: ${esc((m.degradations || []).join("; "))}</span>`
         : `no degradations — every channel present and contributing.`) +
    ` scope: <b>${esc(m.analysed || "")}</b>.`;
}

const LEVELS = ["module", "file", "function"];

function nodeAt(path) {
  let n = TREE;
  for (const seg of path) {
    if (n == null) return null;
    n = Array.isArray(n) ? null : n[seg];
  }
  return n;
}
const isBranch = n => n && !Array.isArray(n);

function countLeaves(n) {
  if (Array.isArray(n)) return n.length;
  let t = 0;
  for (const k in n) t += countLeaves(n[k]);
  return t;
}

function uiFor(key) { return (state.colUI[key] ||= { filter: "", show: PAGE }); }

function render() {
  renderCrumbs();
  const wrap = document.getElementById("columns");
  wrap.textContent = "";
  const depths = state.path.length + (isBranch(nodeAt(state.path)) ? 1 : 0);
  for (let d = 0; d < depths; d++) {
    const parent = nodeAt(state.path.slice(0, d));
    if (!isBranch(parent)) break;
    wrap.appendChild(buildColumn(d, parent));
  }
  const leaf = nodeAt(state.path);
  if (Array.isArray(leaf)) wrap.appendChild(buildClaims(leaf));
  wrap.scrollLeft = wrap.scrollWidth;
}

function renderCrumbs() {
  const c = document.getElementById("crumbs");
  c.textContent = "";
  const root = el("span", "c", "all");
  root.onclick = () => { state.path = []; render(); };
  c.appendChild(root);
  state.path.forEach((seg, i) => {
    c.appendChild(el("span", "sep", "›"));
    const s = el("span", "c", String(seg).split("/").pop());
    s.title = String(seg);
    s.onclick = () => { state.path = state.path.slice(0, i + 1); render(); };
    c.appendChild(s);
  });
  const leaf = nodeAt(state.path);
  if (Array.isArray(leaf) && leaf[0]) {
    const a = el("a", null, "open source ↗");
    a.href = srcUrl(leaf[0].file, leaf[0].line);
    a.target = "_blank"; a.rel = "noopener";
    a.style.cssText = "margin-left:auto;color:var(--info);text-decoration:none;font-size:12px";
    c.appendChild(a);
  }
}

function buildColumn(depth, parent) {
  const col = el("div", "col");
  const key = state.path.slice(0, depth).join("␀");
  const ui = uiFor(key);

  const head = el("div", "col-head");
  head.appendChild(el("span", "name", LEVELS[depth] || "node"));
  const kids = Object.keys(parent).sort();
  head.appendChild(el("span", null, `${kids.length}`));
  col.appendChild(head);

  let shown = kids;
  const label = k => depth === 1 ? k.split("/").slice(-2).join("/") : k;

  if (kids.length > 25) {
    const fw = el("div", "col-filter");
    const inp = document.createElement("input");
    inp.type = "search";
    inp.placeholder = `filter ${kids.length}`;
    inp.value = ui.filter;
    inp.addEventListener("input", () => {
      ui.filter = inp.value.toLowerCase(); ui.show = PAGE; fill();
    });
    fw.appendChild(inp);
    col.appendChild(fw);
  }

  const body = el("div", "col-body");
  col.appendChild(body);
  const selSeg = state.path[depth];

  function fill() {
    body.textContent = "";
    shown = ui.filter ? kids.filter(k => k.toLowerCase().includes(ui.filter)) : kids;
    if (!shown.length) { body.appendChild(el("div", "col-empty", "no matches")); return; }
    const selIdx = shown.indexOf(selSeg);
    if (selIdx >= ui.show) ui.show = Math.ceil((selIdx + 1) / PAGE) * PAGE;
    for (const k of shown.slice(0, ui.show)) {
      const r = el("div", "row" + (k === selSeg ? " sel" : ""));
      r.appendChild(el("span", "k", label(k)));
      r.title = k;
      r.appendChild(el("span", "n", String(countLeaves(parent[k]))));
      r.appendChild(el("span", "arrow", "›"));
      r.onclick = () => { state.path = state.path.slice(0, depth).concat([k]); render(); };
      body.appendChild(r);
    }
    if (shown.length > ui.show) {
      const b = el("button", "more-btn", `${shown.length - ui.show} more`);
      b.onclick = () => { ui.show += PAGE; fill(); };
      body.appendChild(b);
    }
  }
  fill();
  return col;
}

// The full graph is ~4M edges; only the ego network is useful at review time,
// and it is 13.9 MB, so it loads on first function selection rather than upfront.
function ensureCallgraph(cb) {
  if (CG) return cb();
  if (!cgPending) cgPending = fetch("data/callgraph.json").then(r => r.json())
    .then(d => { CG = d.graph || {}; CG._meta = d.meta || {}; })
    .catch(() => { CG = {}; });
  cgPending.then(cb);
}

function buildEgo(fn) {
  const wrap = el("div", "ego");
  const hd = el("div", "hd");
  hd.innerHTML = `<span>call graph</span>`;
  wrap.appendChild(hd);
  const host = el("div");
  wrap.appendChild(host);

  ensureCallgraph(() => {
    const g = (CG || {})[fn];
    if (!g) { hd.innerHTML = `<span>call graph</span><span class="dim">no edges recorded</span>`; return; }
    const ins = g.in || [], outs = g.out || [];
    hd.innerHTML = `<span>call graph</span>` +
      `<b>${g.in_total}</b><span>callers</span><b>${g.out_total}</b><span>callees</span>` +
      ((g.in_total > ins.length || g.out_total > outs.length)
        ? `<span class="warn">showing first ${Math.max(ins.length, outs.length)} — truncated</span>` : ``) +
      // ids in the graph are BARE NAMES, so a common accessor merges every
      // same-named function in the tree. Say so where it misleads most.
      (g.in_total > 500 ? `<span class="warn">· generic name: callers likely merged across the tree</span>` : ``);

    const rows = Math.max(ins.length, outs.length, 1);
    const H = Math.max(60, rows * 15 + 22), W = 640, midX = W / 2;
    const y = i => 16 + i * 15;
    const seg = (arr, x, anchor, dir) => arr.map((n, i) => `
      <line x1="${dir < 0 ? x + 4 : midX + 46}" y1="${y(i) - 3}"
            x2="${dir < 0 ? midX - 46 : x - 4}" y2="${H / 2 - 3}"/>
      <text class="c" x="${x}" y="${y(i)}" text-anchor="${anchor}"
            data-fn="${esc(n.fn)}" data-file="${esc(n.file)}">${esc(n.fn)}</text>`).join("");
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">
      ${seg(ins, midX - 60, "end", -1)}
      ${seg(outs, midX + 60, "start", 1)}
      <text class="mid" x="${midX}" y="${H / 2}" text-anchor="middle">${esc(fn)}</text>
      <text class="dim" x="${midX - 60}" y="10" text-anchor="end">callers</text>
      <text class="dim" x="${midX + 60}" y="10" text-anchor="start">callees</text>
    </svg>`;
    host.querySelectorAll("text.c").forEach(t => {
      t.onclick = () => jumpTo(t.dataset.fn, t.dataset.file);
      t.append(document.createTextNode(""));
      t.setAttribute("title", t.dataset.file || "");
    });
  });
  return wrap;
}

// Navigate to a neighbour if it is in the published slice set; otherwise say so
// rather than silently doing nothing — most callees live outside these 5 modules.
function jumpTo(fn, file) {
  for (const mod in TREE)
    for (const f in TREE[mod])
      if (TREE[mod][f][fn]) { state.path = [mod, f, fn]; render(); return; }
  const c = document.getElementById("crumbs");
  const note = el("span", null, ` — ${fn} is outside the published modules`);
  note.style.cssText = "color:var(--warn);font-size:11px";
  c.appendChild(note);
  setTimeout(() => note.remove(), 2600);
}

function buildClaims(list) {
  const col = el("div", "col");
  const head = el("div", "col-head");
  head.appendChild(el("span", "name", "claims"));
  head.appendChild(el("span", null, String(list.length)));
  col.appendChild(head);
  if (list[0] && list[0].fn) col.appendChild(buildEgo(list[0].fn));
  const body = el("div", "col-body");
  body.innerHTML = list.map(c => `
    <div class="claim">
      <div class="top">${tag(c.shape)}<span class="fn">${esc(c.fn)}</span>
        <span class="q">${esc(c.quant || "")}</span>
        <a class="srclink" href="${esc(srcUrl(c.file, c.line))}" target="_blank" rel="noopener">L${c.line ?? "?"} ↗</a>
      </div>
      <div class="meta">bound <b>${esc(c.bound || "—")}</b> · guard <b>${esc(c.guard || "TOP")}</b></div>
    </div>`).join("");
  col.appendChild(body);
  return col;
}

let TWINS = null;
function showTwins() {
  const host = document.getElementById("twins");
  document.getElementById("columns").style.display = "none";
  document.getElementById("crumbs").style.display = "none";
  host.style.display = "block";
  document.getElementById("tabTwins").classList.add("on");
  document.getElementById("tabBrowse").classList.remove("on");
  if (TWINS) return;
  fetch("data/twins.json").then(r => r.json()).then(d => {
    TWINS = d;
    const m = d.meta || {};
    host.innerHTML =
      `<div class="banner">A shared signature is <b>evidence of similarity, not a duplicate</b> —
       two functions posting the same shape·bound·quant books do mechanically the same thing, but may
       be entirely different code. Over-produces by design; open the source to judge.
       <b>${m.groups}</b> groups · <b>${m.functions_in_groups}</b> functions ·
       <b>${m.removable_loc_total}</b> LOC if every group collapsed to one implementation.</div>` +
      (d.twins || []).slice(0, 150).map(t => `
        <div class="tw">
          <div class="hd">
            <span class="cnt">×${t.count}</span>
            <span class="loc">${t.removable_loc} LOC removable</span>
            <span style="color:var(--text-dim)">of ${t.total_loc}</span>
            <span style="margin-left:auto;color:var(--text-dim)">${t.sig_len} claims in signature</span>
          </div>
          <div class="sig">${t.signature.map(s => tag(s.shape) +
              `<span style="color:var(--text-dim)">${esc(s.bound || "")}</span>`).join(" ")}</div>
          <div class="mem">
            ${t.members.map(mm => `
              <span class="fn">${esc(mm.fn)} <small>${esc(mm.file)}</small></span>
              <span class="num">${mm.loc} loc</span>
              <span class="num">${mm.callers} callers</span>
              <a href="${esc(srcUrl(mm.file, mm.line))}" target="_blank" rel="noopener">L${mm.line ?? "?"} ↗</a>`).join("")}
          </div>
        </div>`).join("");
  });
}
function showBrowse() {
  document.getElementById("twins").style.display = "none";
  document.getElementById("columns").style.display = "flex";
  document.getElementById("crumbs").style.display = "flex";
  document.getElementById("tabBrowse").classList.add("on");
  document.getElementById("tabTwins").classList.remove("on");
}
document.getElementById("tabTwins").onclick = e => { e.preventDefault(); showTwins(); };
document.getElementById("tabBrowse").onclick = e => { e.preventDefault(); showBrowse(); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.path.length) {
    state.path.pop(); render();
  }
});
</script>
</body>
</html>
